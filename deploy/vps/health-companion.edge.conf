# Edge proxy block for the MevaCare AI Health Companion on the VPS that already serves mevacare.com.
#
# Installed INTO the existing `web` container of the v1 stack (mounted as /etc/nginx/conf.d/health-companion.conf by
# deploy/vps/v1-docker-compose.override.yml). nginx picks every conf.d/*.conf up next to v1's own default.conf, so v1's configuration is not edited.
#
# Install this only AFTER the certificate for the new name exists (see docs/deployment.md): a missing certificate file makes nginx refuse to
# start, which would take v1 down with it. The upstream is resolved when a request arrives, not when nginx starts, so a stopped
# health-companion stack can never prevent v1 from starting either.

server {
    listen 80;
    server_name health-companion.mevacare.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name health-companion.mevacare.com;

    ssl_certificate     /etc/letsencrypt/live/health-companion.mevacare.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/health-companion.mevacare.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;

    # Docker's embedded DNS: resolve `hc-web` per request (see the note at the top).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $hc_upstream http://hc-web:80;
        proxy_pass $hc_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Appends the connecting address to what the visitor sent; the API trusts only the entries added by our own proxies.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The assistant streams its answers (server-sent events).
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
