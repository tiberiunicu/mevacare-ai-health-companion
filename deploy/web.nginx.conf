# Inside the application's own stack: serves the single-page app and forwards /api to the API container.
# TLS is terminated one level up (the VPS edge proxy), which tells us the original scheme and client in X-Forwarded-*.

# Keep the scheme the edge proxy saw; fall back to this connection's own scheme when there is none (direct access).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # The API. Responses are streamed (the assistant answers token by token over server-sent events): no buffering, long read timeout.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Only the API's own health endpoints: the app owns every other /health/... route (weight, sleep, activity).
    location ~ ^/health/(live|ready|knowledge)$ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ /index.html;
    }
}
