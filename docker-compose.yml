# Local development dependencies. The API and the web app run directly on the developer machine.
# Not validated in the author's environment (Docker was not installed there): see README.md > "Docker".
name: mevacare-ai-health-companion

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env (copy .env.example)}
    ports:
      - "${MSSQL_PORT:-14330}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Vector database for the medical-knowledge RAG module (Phase 4); see docs/ai/rag-embeddings-memory.md.
  # This compose file was never run; the Qdrant REST usage was verified against the v1.19.2 binary.
  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  sqlserver-data:
  qdrant-data:
